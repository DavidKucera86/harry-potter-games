name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job here needs to write to the repo. Without this block the
# default GITHUB_TOKEN permissions apply, which are broader than anything we use.
permissions:
  contents: read

# A second push to a PR should cancel the first run; pushes to main must not cancel
# each other (a half-finished deploy is worse than a queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre_deploy_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      # Make apt resilient to flaky Ubuntu mirrors: bounded timeouts + retries +
      # IPv4 so a bad mirror fails fast instead of hanging the job. (PR #13 stalled
      # ~1h on azure.archive.ubuntu.com during `playwright install --with-deps`.)
      - name: Harden apt against flaky mirrors
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-resilience >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF
      - run: npx playwright install chromium --with-deps
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - run: npm run verify:build
      - run: npm run typecheck
      - run: npm run audit
      # Split out of `npm test` so the suite runs once, with coverage thresholds on the
      # unit half and the catalog reporter attached to the E2E half.
      - run: npm run build
      - run: npm run lint
      - run: npm run test:coverage
      - run: PLAYWRIGHT_CATALOG=1 npx playwright test
      # History oracle: the catalog describes how the app behaves. If a change alters
      # behaviour without the catalog being regenerated and reviewed, that change is
      # slipping past its own documentation.
      - name: E2E catalog is up to date
        run: |
          git diff --exit-code -- docs/E2E-TEST-CATALOG.md || {
            echo "::error::Chování se změnilo, ale docs/E2E-TEST-CATALOG.md ne."
            echo "Spusť 'npm run docs:test-catalog' a commitni výsledek, nebo oprav test."
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-pre-deploy
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse budgets
    # Purpose oracle: CLAUDE.md puts SEO / responsiveness / a11y on the same footing as
    # tests, but only axe measured any of it. PR-only — this reports on a change, it is
    # not part of the deploy path.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # The app is only ever run in Docker (CLAUDE.md), so budgets are measured against
      # the real nginx artifact — including its security headers — not a dev server.
      - run: docker compose up --build -d
      - name: Wait for the container
        run: |
          for _ in $(seq 1 60); do
            curl -sfo /dev/null http://127.0.0.1:4173/ && exit 0
            sleep 2
          done
          echo "::error::Container did not come up on :4173"
          exit 1
      - run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          # .lighthouseci is a dotfile directory and upload-artifact skips those by
          # default — without this the job passes and silently uploads nothing, which
          # is only discovered on the first run that actually fails.
          include-hidden-files: true
          retention-days: 14

  deploy:
    needs: pre_deploy_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      - run: npx --yes netlify-cli@20.0.0 deploy --prod --dir=. --message="Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  post_deploy_tests:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      # Same apt hardening as pre_deploy_tests (see the comment there).
      - name: Harden apt against flaky mirrors
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-resilience >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF
      - run: npx playwright install chromium --with-deps
      - run: PLAYWRIGHT_TARGET=production PLAYWRIGHT_BASE_URL=${{ secrets.NETLIFY_SITE_URL }} npx playwright test tests/smoke/menu.spec.ts --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-post-deploy
          path: |
            playwright-report/
            test-results/
          retention-days: 14
